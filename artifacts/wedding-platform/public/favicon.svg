<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark luxury background -->
  <rect width="180" height="180" rx="38" fill="#0c0905"/>
  <!-- Gold outer ring -->
  <circle cx="90" cy="90" r="78" stroke="#d4af37" stroke-width="5.5" fill="none"/>
  <!-- Diamond accent at top -->
  <polygon points="90,17 97,25 90,33 83,25" fill="#d4af37"/>
  <!-- Small dots flanking diamond -->
  <circle cx="73" cy="25" r="2.5" fill="#d4af37" opacity="0.6"/>
  <circle cx="107" cy="25" r="2.5" fill="#d4af37" opacity="0.6"/>
  <!-- BMS serif monogram -->
  <text
    x="90" y="112"
    font-family="Georgia, 'Palatino Linotype', 'Book Antiqua', serif"
    font-size="62"
    font-weight="bold"
    fill="#d4af37"
    text-anchor="middle"
    letter-spacing="2"
  >BMS</text>
  <!-- Thin divider line under text -->
  <line x1="54" y1="124" x2="126" y2="124" stroke="#d4af37" stroke-width="1.5" opacity="0.5"/>
</svg>
