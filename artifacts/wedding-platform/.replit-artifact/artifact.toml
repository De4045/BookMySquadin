kind = "web"
previewPath = "/"
title = "Wedding Planning Platform"
version = "1.0.0"
id = "artifacts/wedding-platform"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20823

[services.development]
run = "pnpm --filter @workspace/wedding-platform run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/wedding-platform", "run", "build" ]
publicDir = "artifacts/wedding-platform/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20823"
BASE_PATH = "/"
